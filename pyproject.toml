[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falcon-delivery-chatbot"
version = "0.1.0"
description = "Falcon Delivery Rasa chatbot bootstrap"
requires-python = ">=3.10,<3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["actions", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
files = ["actions", "tests", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true
