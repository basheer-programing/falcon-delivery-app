version: "3.1"


intents:
  # أساسيات الترحيب والوداع
  - greet
  - goodbye
  - chitchat
  - ask_capabilities

  # طلب المنتج (جميع الاحتمالات)
  - order_request
  - order_by_budget
  - order_product_budget
  - order_from_store
  - detailed_order_request
  - order_with_delivery_time
  - full_order_request

  # خدمات ما قبل الطلب
  - ask_recommendation
  - smart_recommendation
  - ask_weather_food
  - ask_calories
  - ask_kids_meal
  - ask_family_meal
  - ask_surprise_meal
  - compare_food
  - ask_card_restaurants
  - ask_promo_code
  - set_delivery_address
  - ask_allergy_food
  - ask_urgent_food
  - thanks
  - add_to_cart
  - show_cart
  - confirm_order
  - cancel

  # إدارة الطلب
  - track_order
  - ask_status
  - edit_order
  - rate_order

  # الدفع والدعم والشكاوى
  - payment_issue
  - ask_delivery_fee
  - contact_support
  - complain

  # الأسئلة الشائعة والعروض والمنتجات
  - ask_faq
  - ask_promotion
  - ask_working_hours
  - ask_local_offers
  - ask_about_product

  # تاريخ الطلبات
  - order_history

  # نية المعلومات (لتعبئة النماذج)
  - inform

entities:
  - product
  - budget
  - store
  - delivery_time
  - order_id
  - quantity
  - payment_method
  - area
  - rating
  - complaint_type
  - health_condition
  - diet_goal
  - mood
  - meal_time
  - people_count

slots:
  # فتحات الطلب الأساسية
  product:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: product

  budget:
    type: float
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: budget

  store:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: store

  delivery_time:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: delivery_time

  order_id:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: order_id

  quantity:
    type: float
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: quantity

  payment_method:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: payment_method

  area:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: area

  health_condition:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: health_condition

  diet_goal:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: diet_goal

  mood:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: mood

  meal_time:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: meal_time

  people_count:
    type: float
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: people_count

  # فتحات التقييم والشكاوى
  rating:
    type: float
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: rating

  comment:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: complain_form
            requested_slot: comment
          - active_loop: rating_form
            requested_slot: comment

  complaint_type:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: complaint_type

  # فتحة لتخزين حالة المستخدم الحالية
  user_session_state:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  # سلة الطلب - يتم تحديثها من actions.py
  cart:
    type: list
    influence_conversation: false
    mappings:
      - type: custom

forms:
  # نموذج الطلب الرئيسي (يغطي منتج، ميزانية، متجر، وقت)
  order_form:
    required_slots:
      - product
      - budget
      - store
      - delivery_time

  # نموذج تتبع الطلب
  track_form:
    required_slots:
      - order_id

  # نموذج تعديل الطلب
  edit_form:
    required_slots:
      - product
      - quantity
      - store
      - delivery_time

  # نموذج تقديم شكوى (جديد)
  complain_form:
    required_slots:
      - complaint_type
      - comment
      - order_id

  # نموذج التقييم (جديد)
  rating_form:
    required_slots:
      - rating
      - comment

responses:


  utter_greet:
    - text: |
        🦅 مرحباً بك في **فالكون دليفري**!
        معك المساعد **بشير الحبشي**. شو بقدر ساعدك اليوم؟
        فيني ساعدك تختار أكلة، مطعم، ميزانية، عرض أو وجبة مناسبة لهدفك الغذائي.
        اختر مما يلي:
      buttons:
        - title: "🛒 طلب جديد"
          payload: "/order_request"
        - title: "📍 تتبع طلبي"
          payload: "/track_order"
        - title: "❓ مساعدة"
          payload: "/ask_faq"
        - title: "🏷️ عروض اليوم"
          payload: "/ask_promotion"
        - title: "📞 اتصل بالدعم"
          payload: "/contact_support"
    - text: |
        أهلان وسهلان بك في فالكون! 🚀
        أنا روبوت الدعم الذكي، جاهز لمساعدتك في أي وقت.
        كيف يمكنني أن أخدمك اليوم؟
      buttons:
        - title: "طلب وجبة"
          payload: "/order_request"
        - title: "تتبع شحنة"
          payload: "/track_order"
        - title: "عروض وخصومات"
          payload: "/ask_promotion"
        - title: "شكوى أو استفسار"
          payload: "/contact_support"
    - text: |
        السلام عليكم! 🌟
        مرحباً بكم في خدمة فالكون للتوصيل.
        أنا هنا لتسهيل طلباتكم وجعل تجربتكم ممتعة.
        ماذا تريد أن تفعل الآن؟
      buttons:
        - title: "طلب جديد"
          payload: "/order_request"
        - title: "تتبع طلب"
          payload: "/track_order"
        - title: "التواصل مع الدعم"
          payload: "/contact_support"
    - text: |
        🎯 مرحباً! أنت الآن في فالكون دليفري.
        نقدم لك أسرع خدمة توصيل في دمشق والمدن السورية.
        اختر الخيار المناسب لك:
      buttons:
        - title: "اطلب الآن"
          payload: "/order_request"
        - title: "تتبع"
          payload: "/track_order"
        - title: "العروض"
          payload: "/ask_promotion"

  utter_goodbye:
    - text: "مع السلامة! نشكرك على استخدامك Falcon Delivery. نتمنى لك يوماً سعيداً! 🌟"
    - text: "إلى اللقاء! أتمنى أن تكون وجبتك لذيذة. في خدمتك دائماً."
    - text: "وداعاً! نأمل أن نراك قريباً. لا تنسَ تقييم خدمتنا."
    - text: "شكراً لثقتك بنا. مع السلامة، ونحن في انتظار طلبك القادم."
    - text: "سلام! إذا احتجت شيئاً، نحن هنا. إلى اللقاء."
    - text: "🕊️ نتركك في أمان الله. شكراً لتجربة فالكون دليفري."
    - text: "👋 باي باي! نتمنى أن تكون راضياً عن خدمتنا. تواصل معنا لأي استفسار."

  utter_chitchat:
    - text: "أنا بخير وجاهز أساعدك بطلب وجبة أو تتبع طلبك. شو بتحب تعمل؟"
    - text: "أهلاً فيك! فينا نحكي عن الطلبات، المطاعم، الأسعار، التوصيل والعروض."
    - text: "تمام، أنا معك. اكتب مثلاً: بدي بيتزا، أو تتبع طلبي، أو شو في عروض؟"

  utter_capabilities:
    - text: |
        بقدر أساعدك في:
        • البحث عن وجبة أو مطعم
        • اقتراح وجبات حسب الميزانية
        • إضافة المنتجات للسلة وتأكيد الطلب
        • تتبع الطلب وتحديث حالته
        • العروض، الدفع، الشكاوى والتقييم
        اكتب طلبك بطريقتك الطبيعية وسأطلب التفاصيل الناقصة منك.

  utter_thanks:
    - text: "العفو يا غالي، بالخدمة دائماً. بالهنا والشفا 😊"
    - text: "تكرم عيونك، سعدت بخدمتك. إذا بدك شي تاني أنا موجود."


  utter_searching:
    - text: "🔍 جارٍ البحث عن أفضل العروض التي تناسب احتياجاتك... لحظة من فضلك."
    - text: "⏳ أعمل على تجهيز قائمة الوجبات المتوفرة حسب طلبك."
    - text: "📋 جارٍ تحليل طلبك وعرض الخيارات المناسبة... انتظر قليلاً."
    - text: "🔄 نبحث في قائمة المتاجر والمنتجات... سيتم الرد خلال ثوان."
    - text: "🧐 دعني أتحقق من العروض المتاحة لك... لحظة واحدة."
    - text: "⚡ جارٍ الاتصال بقاعدة البيانات لعرض المنتجات المتاحة."
    - text: "📡 نبحث في منيو المطاعم الشريكة... سيتم عرض النتائج فوراً."


  utter_recommendation:
    - text: |
        📋 بناءً على طلبك، أقترح عليك الأصناف التالية الأكثر مبيعاً:
        1. 🍗 شاورما دجاج (مع بطاطا ومشروب) - 35000 ليرة
        2. 🍕 بيتزا عائلية (جبنة وزعتر) - 50000 ليرة
        3. 🍔 برغر دبل (بصل مقلي وجبنة) - 40000 ليرة
        هل ترغب بإضافة أحدها إلى السلة؟
      buttons:
        - title: "شاورما"
          payload: '/add_to_cart{"product": "شاورما"}'
        - title: "بيتزا عائلية"
          payload: '/add_to_cart{"product": "بيتزا عائلية"}'
        - title: "برغر"
          payload: '/add_to_cart{"product": "برغر"}'
        - title: "لا شكراً"
          payload: "/cancel"
    - text: |
        🔥 بناءً على تقييمات العملاء، إليك أفضل الوجبات اليوم:
        • شاورما اللحم الخاصة - 40000 ليرة
        • بيتزا المارجريتا - 30000 ليرة
        • سلطة التبولة الطازجة - 15000 ليرة
        ماذا تختار؟
      buttons:
        - title: "شاورما لحم"
          payload: '/add_to_cart{"product": "شاورما لحم"}'
        - title: "بيتزا مارجريتا"
          payload: '/add_to_cart{"product": "بيتزا مارجريتا"}'
        - title: "تبولة"
          payload: '/add_to_cart{"product": "تبولة"}'
        - title: "لا شي"
          payload: "/cancel"
    - text: |
        🥇 الأكثر طلباً اليوم:
        • وجبة الدجاج المشوي مع الأرز - 60000 ليرة
        • برغر تشييز مع بطاطا - 35000 ليرة
        • كنافة نابلسية - 15000 ليرة
        هل تريد إضافة واحدة؟
      buttons:
        - title: "دجاج مشوي"
          payload: '/add_to_cart{"product": "دجاج مشوي"}'
        - title: "برغر تشييز"
          payload: '/add_to_cart{"product": "برغر تشييز"}'
        - title: "كنافة"
          payload: '/add_to_cart{"product": "كنافة"}'
    - text: |
        💎 اقتراحاتي الذكية لك (بناءً على طلباتك السابقة):
        • 🍕 بيتزا عائلية بالجبنة - 48000 ليرة
        • 🥙 شاورما دجاج مع صوص الثوم - 32000 ليرة
        • 🍲 شوربة العدس مع الليمون - 8000 ليرة
        ماذا تفضل؟
      buttons:
        - title: "بيتزا عائلية"
          payload: '/add_to_cart{"product": "بيتزا عائلية"}'
        - title: "شاورما دجاج"
          payload: '/add_to_cart{"product": "شاورما دجاج"}'
        - title: "شوربة عدس"
          payload: '/add_to_cart{"product": "شوربة عدس"}'
    - text: |
        🌟 خيارات اقتصادية ممتازة:
        1. فلافل ساندويش - 12000 ليرة
        2. فطيرة زعتر - 8000 ليرة
        3. حمص بالطحينة - 7000 ليرة
        هل ترغب بواحد منها؟
      buttons:
        - title: "فلافل"
          payload: '/add_to_cart{"product": "فلافل"}'
        - title: "فطيرة زعتر"
          payload: '/add_to_cart{"product": "فطيرة زعتر"}'
        - title: "حمص"
          payload: '/add_to_cart{"product": "حمص"}'

 
  utter_ask_product:
    - text: "🍽️ ما هو المنتج الذي ترغب في طلبه؟ (مثل: بيتزا، شاورما، برغر، كنافة)"
    - text: "📝 يرجى تحديد المنتج المطلوب: (مثال: بيتزا عائلية، شاورما دجاج)"
    - text: "🛒 أخبرني بالمنتج الذي ترغب به، وسأبحث عنه."
    - text: "🤔 ما هو نوع الوجبة التي تريدها؟"
    - text: "📋 من فضلك اكتب اسم المنتج الذي تريد شراءه."

  utter_ask_budget:
    - text: "💰 كم الميزانية المتوفرة لديك لهذا الطلب؟ (مثلاً: 50000 أو 30 ألف)"
    - text: "💵 ما هو المبلغ الذي ترغب في إنفاقه؟"
    - text: "🧮 حدد السعر الذي يناسبك."
    - text: "🏷️ ما هي ميزانيتك التقريبية؟"
    - text: "💳 كم تقدر قيمة الطلب الذي تريده؟"

  utter_ask_store:
    - text: "🏪 من أي متجر أو مطعم ترغب في الطلب؟ (مثل: مطعم النور، مطعم الشام)"
    - text: "📍 حدد اسم المطعم أو المتجر الذي تفضله."
    - text: "🍽️ من أي مطعم تريد أن تطلب؟"
    - text: "🏠 هل لديك مطعم مفضل تريد الطلب منه؟"
    - text: "📌 أين تريد أن تطلب وجبتك؟"

  utter_ask_delivery_time:
    - text: "⏰ متى ترغب في استلام طلبك؟ (مثلاً: خلال نصف ساعة، أو عاجل)"
    - text: "⌚ حدد وقت التوصيل المناسب لك."
    - text: "🕒 في أي وقت تريد وصول الطلب؟"
    - text: "📅 متى تريد أن يصل طلبك؟"
    - text: "⏳ اختر الوقت المناسب للتوصيل:"

  utter_ask_order_id:
    - text: "🔢 يرجى إدخال رقم الطلب الذي تريد تتبعه (موجود في رسالة التأكيد)."
    - text: "📋 أدخل رقم الطلب المكون من 4-6 أرقام."
    - text: "🧾 ما هو رقم الطلب الذي تريد الاستعلام عنه؟"
    - text: "📑 من فضلك أرسل رقم الطلب الخاص بك."

  utter_ask_quantity:
    - text: "🔢 كم عدد {product} الذي تريده؟"
    - text: "📦 حدد الكمية المطلوبة من {product}."
    - text: "🧮 كم وحدة من {product} تريد إضافتها؟"
    - text: "📊 كم طلبية من {product} ترغب بها؟"

  utter_ask_rating:
    - text: "⭐ كيف تقيم تجربتك معنا؟ من 1 إلى 5 نجوم."
