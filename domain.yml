        - title: "⭐⭐ 4 نجوم"
          payload: '/rate_order{"rating": "4"}'
        - title: "⭐⭐⭐ 3 نجوم"
          payload: '/rate_order{"rating": "3"}'
        - title: "⭐⭐⭐⭐ 2 نجوم"
          payload: '/rate_order{"rating": "2"}'
        - title: "⭐ 1 نجمة"
          payload: '/rate_order{"rating": "1"}'
    - text: "🌟 كيف كانت تجربتك مع السائق والمطعم؟"
      buttons:
        - title: "ممتاز"
          payload: '/rate_order{"rating": "5"}'
        - title: "جيد"
          payload: '/rate_order{"rating": "4"}'
        - title: "مقبول"
          payload: '/rate_order{"rating": "3"}'
        - title: "سيء"
          payload: '/rate_order{"rating": "2"}'
        - title: "كارثة"
          payload: '/rate_order{"rating": "1"}'

  utter_ask_complaint_type:
    - text: "📝 ما هو نوع الشكوى؟ (تأخر، منتج خاطئ، منتج تالف، سوء تعامل، أخرى)"
    - text: "❓ اختر نوع المشكلة التي تواجهها:"
      buttons:
        - title: "تأخر التوصيل"
          payload: '/complain{"complaint_type": "تأخر"}'
        - title: "منتج خاطئ"
          payload: '/complain{"complaint_type": "منتج خاطئ"}'
        - title: "منتج تالف"
          payload: '/complain{"complaint_type": "منتج تالف"}'
        - title: "سوء تعامل"
          payload: '/complain{"complaint_type": "سوء تعامل"}'
        - title: "أخرى"
          payload: '/complain{"complaint_type": "أخرى"}'

  utter_ask_comment:
    - text: "✍️ يرجى كتابة تفاصيل الشكوى بالتفصيل (ماذا حدث بالضبط؟)."
    - text: "📝 أخبرني بما حدث معك وسنحل المشكلة فوراً."


  utter_added_to_cart:
    - text: "✅ تم إضافة {product} إلى سلة الطلب بنجاح. هل تريد إضافة شيء آخر أم تريد تأكيد الطلب؟"
      buttons:
        - title: "إضافة آخر"
          payload: "/order_request"
        - title: "تأكيد الطلب"
          payload: "/confirm_order"
        - title: "عرض السلة"
          payload: "/show_cart"
    - text: "👍 أضفنا {product} إلى سلتك. ماذا تريد أن تفعل الآن؟"
      buttons:
        - title: "أضف منتجاً آخر"
          payload: "/order_request"
        - title: "أكمل الطلب"
          payload: "/confirm_order"
        - title: "شاهد السلة"
          payload: "/show_cart"
    - text: "🛒 تمت إضافة {product} بنجاح. رغبة في المزيد؟"
      buttons:
        - title: "نعم، أضف آخر"
          payload: "/order_request"
        - title: "لا، أنهي الطلب"
          payload: "/confirm_order"
    - text: "🍕 تم إضافة {product} × {quantity}. السلة في انتظارك."
      buttons:
        - title: "أضف المزيد"
          payload: "/order_request"
        - title: "تأكيد"
          payload: "/confirm_order"
        - title: "إلغاء الكل"
          payload: "/cancel"

  utter_show_cart:
    - text: |
        🛒 محتويات سلتك الحالية:
        - {product} (الكمية: {quantity}) بسعر محسوب.
        المجموع الكلي سيتم حسابه عند التأكيد.
        هل ترغب بالتعديل أم التأكيد؟
      buttons:
        - title: "تأكيد الطلب"
          payload: "/confirm_order"
        - title: "إلغاء الكل"
          payload: "/cancel"
        - title: "تعديل الكميات"
          payload: "/edit_order"
    - text: |
        📋 سلة الطلب تحتوي على:
        - {product} × {quantity}
        المجموع التقريبي: سيظهر عند التأكيد.
        ماذا تريد أن تفعل؟
      buttons:
        - title: "تأكيد"
          payload: "/confirm_order"
        - title: "إلغاء"
          payload: "/cancel"
    - text: |
        🧾 ملخص سلة المشتريات:
        المنتج: {product}
        الكمية: {quantity}
        السعر الإجمالي: سيتم حسابه في الخطوة التالية.
        هل أنت مستعد للتأكيد؟
      buttons:
        - title: "نعم، أؤكد"
          payload: "/confirm_order"
        - title: "لا، ألغي"
